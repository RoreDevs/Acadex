<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="description" content="Acadex - University Attendance Management System" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all';this.onload=null" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" /></noscript>
    <title>Acadex - Attendance Management</title>
  </head>
  <body class="antialiased">
    <div id="root">
      <div id="splash" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc;flex-direction:column;gap:24px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="color:white;font-size:20px;font-weight:700;font-family:sans-serif">A</span>
          </div>
          <span style="font-size:22px;font-weight:700;color:#1e293b;font-family:sans-serif">Acadex</span>
        </div>
        <div style="display:flex;gap:6px;justify-content:center">
          <div class="splash-dot" style="width:10px;height:10px;border-radius:50%;background:#1e3a5f;animation:splash-bounce 0.6s infinite alternate;animation-delay:0s"></div>
          <div class="splash-dot" style="width:10px;height:10px;border-radius:50%;background:#1e3a5f;animation:splash-bounce 0.6s infinite alternate;animation-delay:0.15s"></div>
          <div class="splash-dot" style="width:10px;height:10px;border-radius:50%;background:#1e3a5f;animation:splash-bounce 0.6s infinite alternate;animation-delay:0.3s"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var splash = document.getElementById('splash');
        var maxWait = setTimeout(function() {
          if (splash) splash.style.display = 'none';
        }, 8000);
        window.__hideSplash = function() {
          clearTimeout(maxWait);
          if (splash) {
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 0.3s';
            setTimeout(function() { splash.style.display = 'none'; }, 300);
          }
        };
        if (navigator.serviceWorker) {
          var isStuck = setTimeout(function() {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
              caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); });
              location.reload();
            });
          }, 10000);
          window.__clearStuckSw = function() { clearTimeout(isStuck); };
        }
      })();
    </script>
    <style>
      @keyframes splash-bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-8px); }
      }
    </style>
  </body>
</html>
